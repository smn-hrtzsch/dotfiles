description = "Generiert eine Conventional Commit Message und führt den Commit aus."

prompt = """
Analysiere die folgenden gestagten Änderungen (`git diff --staged`) und führe den Commit durch.

**Deine Aufgabe:**
1. Generiere eine **perfekte Commit-Message** nach [Conventional Commits](https://www.conventionalcommits.org/).
   - Format: `<type>(<scope>): <description>`
   - Types: feat, fix, docs, style, refactor, test, chore.
   - Kurz, prägnant, englisch.
2. Führe den Befehl `git commit -m "..."` mit deiner generierten Message direkt aus (nutze das `run_shell_command` Tool).

Hier sind die Änderungen:
```diff
!{git diff --staged}
```
"""
