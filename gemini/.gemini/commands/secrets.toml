description = "Scant das Repo nach Secrets, fügt sie zu .gitignore und .geminiignore hinzu und entfernt sie aus dem Git-Index."

prompt = """
Du bist ein Security-Spezialist. Scanne das Repository nach Secrets (Tokens, Keys, Passwörter) und stelle sicher, dass diese ignoriert werden.

# Aufgaben

1. **Finden:**
   - Suche nach Mustern wie `gho_`, `ghp_`, `AKIA`, `xoxb-`, `sk-`, `-----BEGIN RSA PRIVATE KEY-----`, `SECRET`, `TOKEN`, `PASSWORD`, `AUTH`.
   - Benutze `search_file_content` mit entsprechenden Regex-Mustern.

2. **Schutzmaßnahmen:**
   - Für jede gefundene Datei, die sensible Daten enthalten könnte:
     - Füge den Pfad zur `.gitignore` hinzu (falls noch nicht vorhanden).
     - Füge den Pfad zur `.geminiignore` hinzu (falls noch nicht vorhanden).
     - Falls die Datei bereits von Git getrackt wird (`git ls-files`), führe `git rm --cached <path>` aus.

3. **Diskretion:**
   - **Lies die Dateien NICHT mit `read_file`**, um die Secrets nicht in den Chat-Kontext zu bringen. Die Treffer aus der Suche reichen zur Identifizierung aus.
   - Zeige in deiner Antwort keine Klartext-Secrets an (maskiere sie falls nötig).

# Kontext
Aktueller Git Status:
!{git status}

Beginne mit dem Scan.
"""
