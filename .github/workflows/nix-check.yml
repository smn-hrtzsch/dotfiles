name: Nix Configuration Check

on:
  workflow_dispatch: # Manuell via GitHub UI oder CLI triggerbar
  push:
    branches:
      - chore/nix-migration

jobs:
  build-and-check:
    runs-on: macos-latest # Nutzt macOS 14 (Apple Silicon M1), passend für deine aarch64 config
    
    permissions:
      id-token: "write"
      contents: "read"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v9

    - name: Check Flake Syntax
      run: nix flake check

    - name: Build Darwin System (Dry Run)
      # Baut die Konfiguration, ohne sie anzuwenden.
      # Prüft, ob alle Pakete laden und die Syntax stimmt.
      run: nix build .#darwinConfigurations.MacBook-Air-von-Simon.system
